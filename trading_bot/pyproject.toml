[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "A strategy-agnostic trading bot scaffold"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115",
	"metatrader5>=5.0.6231; sys_platform == 'win32'",
	"psycopg[binary]>=3.2",
	"uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]
mt5 = ["MetaTrader5>=5.0; sys_platform == 'win32'""]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-environments = [
	"sys_platform == 'win32'",
	"sys_platform == 'linux'"
]

